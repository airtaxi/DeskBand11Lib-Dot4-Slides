<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deskband11Lib — Title</title>
<link href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css" rel="stylesheet">
<style>
/* === BASE / FIXED STAGE === */
html,body{margin:0;padding:0;height:100%;background:#004040;overflow:hidden}
.viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.stage{width:1920px;height:1080px;flex:none;position:relative;overflow:hidden;transform-origin:center center;
  background:#008080;font-family:'Galmuri11','Galmuri9',sans-serif;image-rendering:pixelated}

/* === CRT OVERLAY === */
.crt{position:absolute;inset:0;pointer-events:none;z-index:50;opacity:.04;
  background:repeating-linear-gradient(0deg,#000 0 1px,transparent 1px 3px)}

/* === WIN95 BEVEL HELPERS === */
.raised{background:#c0c0c0;box-shadow:inset -1px -1px #0a0a0a,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf}
.sunken{background:#fff;box-shadow:inset 1px 1px #0a0a0a,inset -1px -1px #fff,inset 2px 2px #808080,inset -2px -2px #dfdfdf}

/* === MAIN WINDOW === */
.win{position:absolute;left:260px;top:130px;width:1400px;z-index:5;padding:5px;
  animation:openwin .28s steps(3) .25s both}
.titlebar{height:58px;background:linear-gradient(90deg,#000080,#1084d0);display:flex;align-items:center;padding:0 14px;gap:16px}
.titlebar .tb-title{flex:1;color:#fff;font-family:'Galmuri11',sans-serif;font-size:28px;display:flex;align-items:center;gap:16px}
.tb-ico{width:32px;height:32px;background:#c0c0c0;box-shadow:inset -1px -1px #0a0a0a,inset 1px 1px #fff;display:grid;place-items:center}
.tb-ico i{display:grid;grid-template-columns:10px 10px;grid-template-rows:10px 10px;gap:2px}
.tb-ico i b{background:#000080}
.sysbtn{width:44px;height:40px;font-family:'Galmuri9',sans-serif;font-size:22px;display:grid;place-items:center;color:#000}
.menubar{height:48px;display:flex;align-items:center;gap:44px;padding:0 26px;background:#c0c0c0;
  font-size:24px;color:#000;border-bottom:1px solid #808080;box-shadow:0 1px 0 #fff}
.menubar u{text-decoration:underline}

/* === CONTENT AREA === */
.content{margin:8px;padding:78px 84px 60px;position:relative}
.badge{display:inline-block;font-family:'Galmuri9',sans-serif;font-size:22px;color:#008080;letter-spacing:2px;
  border:2px solid #008080;padding:8px 18px;margin-bottom:44px;opacity:0;animation:appear .01s linear .7s both}
.h1{font-family:'Galmuri14','Galmuri11',sans-serif;font-size:74px;line-height:1.4;color:#000;margin:0}
.h1 .l{display:block;opacity:0}
.h1 .l:nth-child(1){animation:appear .01s linear .9s both}
.h1 .l:nth-child(2){animation:appear .01s linear 1.15s both}
.h1 .l.navy{color:#000080;animation:appear .01s linear 1.4s both}
.caret{display:inline-block;width:36px;height:8px;background:#000080;margin-left:14px;vertical-align:6px;
  animation:blink 1s steps(1) infinite 1.8s}
.divider{height:2px;background:#808080;box-shadow:0 1px 0 #fff;margin:52px 0 40px;border:0}
.speaker{font-size:30px;color:#222;display:flex;align-items:center;gap:22px;opacity:0;animation:appear .01s linear 1.6s both}
.speaker .chip{font-family:'Galmuri9',sans-serif;font-size:20px;color:#fff;background:#008080;padding:6px 14px}
.btnrow{margin-top:58px;display:flex;gap:26px;opacity:0;animation:appear .01s linear 1.85s both}
.btn95{min-width:250px;height:66px;font-family:'Galmuri11',sans-serif;font-size:26px;color:#000;
  display:grid;place-items:center;position:relative;cursor:pointer}
.btn95.default::after{content:"";position:absolute;inset:6px;border:1px dotted #000}
.statusbar{margin:0 8px 8px;height:46px;display:flex;gap:6px}
.statusbar .cell{box-shadow:inset 1px 1px #808080,inset -1px -1px #fff;background:#c0c0c0;
  font-family:'Galmuri9',sans-serif;font-size:21px;color:#222;display:flex;align-items:center;padding:0 20px}
.statusbar .cell.grow{flex:1}

/* === WIN95 TASKBAR (stage bottom) === */
.taskbar{position:absolute;left:0;right:0;bottom:0;height:72px;background:#c0c0c0;z-index:20;
  box-shadow:inset 0 2px 0 #dfdfdf,inset 0 3px 0 #fff;display:flex;align-items:center;gap:14px;padding:0 12px;
  animation:riseup .22s steps(3) .1s both}
.startbtn{height:52px;padding:0 22px;display:flex;align-items:center;gap:12px;font-family:'Galmuri11',sans-serif;
  font-size:26px;font-weight:bold;color:#000}
.flag{display:grid;grid-template-columns:13px 13px;grid-template-rows:13px 13px;gap:2px}
.flag b:nth-child(1){background:#f25022}.flag b:nth-child(2){background:#7fba00}
.flag b:nth-child(3){background:#00a4ef}.flag b:nth-child(4){background:#ffb900}
.taskitem{height:52px;padding:0 24px;display:flex;align-items:center;gap:14px;font-size:23px;color:#000;
  background:#c0c0c0;box-shadow:inset 1px 1px #0a0a0a,inset -1px -1px #fff,inset 2px 2px #808080,inset -2px -2px #dfdfdf}
.taskitem i{width:22px;height:22px;background:#000080}
.tray{margin-left:auto;height:52px;padding:0 24px;display:flex;align-items:center;gap:18px;
  box-shadow:inset 1px 1px #808080,inset -1px -1px #fff;font-size:23px;color:#000}

/* === KEYFRAMES === */
@keyframes openwin{from{transform:scale(.65);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes appear{from{opacity:0}to{opacity:1}}
@keyframes riseup{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01s !important;animation-delay:0s !important}
}
</style>
</head>
<body>
<div class="viewport">
  <div class="stage">

    <div class="win raised">
      <div class="titlebar">
        <div class="tb-title">
          <span class="tb-ico"><i><b></b><b></b><b></b><b></b></i></span>
          DESKBAND11LIB — .NET Conference 2026
        </div>
        <div class="sysbtn raised">_</div>
        <div class="sysbtn raised">▢</div>
        <div class="sysbtn raised">✕</div>
      </div>
      <div class="menubar"><span><u>파</u>일(F)</span><span><u>편</u>집(E)</span><span><u>보</u>기(V)</span><span><u>도</u>구(T)</span><span><u>도</u>움말(H)</span></div>
      <div class="content sunken">
        <div class="badge">SINCE WINDOWS 95 · GONE IN WINDOWS 11</div>
        <h1 class="h1">
          <span class="l">윈도우 11에서 사라진</span>
          <span class="l">작업표시줄 데스크밴드,</span>
          <span class="l navy">WinUI·WPF로 되살려봤습니다<span class="caret"></span></span>
        </h1>
        <hr class="divider">
        <div class="speaker">발표자: 이호원 · Howon Lee <span class="chip">airtaxi</span></div>
        <div class="btnrow">
          <div class="btn95 raised default">시작하기</div>
          <div class="btn95 raised">취소</div>
        </div>
      </div>
      <div class="statusbar">
        <div class="cell grow">Deskband11Lib을(를) 불러왔습니다. 계속하려면 [시작하기]를 누르십시오.</div>
        <div class="cell">슬라이드 1/35</div>
        <div class="cell">100%</div>
      </div>
    </div>

    <div class="taskbar">
      <div class="startbtn raised"><span class="flag"><b></b><b></b><b></b><b></b></span>시작</div>
      <div class="taskitem"><i></i>Deskband11Lib — 발표</div>
      <div class="tray">오후 1:30</div>
    </div>

    <div class="crt"></div>
  </div>
</div>
<script>
function fit(){var s=Math.min(innerWidth/1920,innerHeight/1080);document.querySelector('.stage').style.transform='scale('+s+')';}
addEventListener('resize',fit);fit();
</script>
</body>
</html>
